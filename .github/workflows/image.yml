# Image: the assembled overlay as a multi-arch container image on GHCR.
#
#   ghcr.io/jeremyandrews/netgrasp-trovato
#     /netgrasp/plugins/netgrasp/   netgrasp.wasm, netgrasp.info.toml, migrations/
#     /netgrasp/templates/
#     /netgrasp/static/
#
# The same three directories as the release tarball, for a deployment that
# pulls images rather than downloading files: an init container copies
# /netgrasp into a shared volume and the published Trovato kernel image appends
# the three paths to PLUGINS_DIR, TEMPLATES_DIR and STATIC_DIR.
#
# Tags: every push to main publishes `sha-<12 character commit>`, which is what a
# deployment pins; a `v*` tag publishes the version and `latest`. Nothing is
# published from a pull request.
#
# The build is docker/overlay.Dockerfile's `published` stage, which runs
# scripts/build-overlay.sh like every other consumer, so the capability check
# against the module's real imports runs here too.

name: Image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    name: build and push the overlay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository_owner }}/netgrasp-trovato
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tags=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/overlay.Dockerfile
          target: published
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Netgrasp for Trovato: the plugin, templates and static files for the kernel's search paths
          cache-from: type=gha
          cache-to: type=gha,mode=max
