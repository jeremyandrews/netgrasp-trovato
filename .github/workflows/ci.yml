name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The pin lives in rust-toolchain.toml, which rustup honours and
  # dtolnay/rust-toolchain does not read. The two must move together; the bump
  # protocol is in that file.
  RUST_TOOLCHAIN: 1.96.0

jobs:
  # The claim this repository exists to make: it builds with no Trovato checkout
  # on disk. Nothing in this job clones Trovato — cargo fetches the SDK from the
  # pinned public git revision, which is the only Trovato that appears anywhere.
  standalone:
    name: builds standalone (no Trovato checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-wasip1 --release -- -D warnings

      - name: Build the module
        run: cargo build --target wasm32-wasip1 --release

      # A cdylib that compiled but exports nothing is a plugin the kernel loads
      # and never calls. The size floor catches an empty or truncated artifact.
      - name: The module is real
        run: |
          wasm=target/wasm32-wasip1/release/netgrasp.wasm
          test -f "$wasm"
          size=$(wc -c <"$wasm")
          echo "$size bytes"
          test "$size" -gt 100000

      # The manifest's capability allowlist has to match the artifact's actual
      # host imports, in both directions. See the script for why this is derived
      # from the binary rather than from the source.
      - name: Declared capabilities match the module
        run: scripts/check-host-imports.sh

      - name: The overlay assembles
        run: |
          scripts/build-overlay.sh --no-build
          test -f overlay/plugins/netgrasp/netgrasp.wasm
          test -f overlay/plugins/netgrasp/netgrasp.info.toml
          test -f overlay/plugins/netgrasp/migrations/001_netgrasp_schema.sql

      - name: Documentation builds
        run: cargo doc --no-deps

      # Belt and braces on the repository's whole reason for being: no manifest
      # here may reach into a Trovato checkout by path.
      # Comments are stripped first: the workspace manifest documents the banned
      # form in prose, and a check that cannot tell a warning from a violation is
      # a check that gets deleted the first time it cries wolf.
      - name: No path dependency on Trovato
        run: |
          offenders=$(find . -name Cargo.toml -not -path './target/*' \
            -exec grep -Hn 'path *= *"\.\./\.\./crates' {} + \
            | grep -v ':[0-9]*:#' || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::a crate depends on a Trovato checkout by path"
            exit 1
          fi

  # netgrasp-core's daemon-schema test applies the daemon's real DDL to a scratch
  # schema and runs the plugin's real statements against it, so it needs Postgres.
  # It is the one test on this side that ever meets the schema the plugin is
  # written for, so it must not be allowed to quietly not run.
  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trovato
          POSTGRES_PASSWORD: trovato
          POSTGRES_DB: trovato
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trovato"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # The host-in-the-loop test loads the module from the overlay, so the
      # overlay has to exist before the suite runs. This is also the step that
      # makes the test meet the module CI just built rather than a stale one — in
      # the monorepo this test read a `netgrasp.wasm` committed to git, so it
      # could pass against a module nobody had rebuilt in weeks.
      - name: Build the overlay the integration test loads
        run: scripts/build-overlay.sh

      # `pipefail` is not optional here: without it the step's exit status is
      # tee's, which is always 0, and a failing test suite reports green.
      - name: Tests
        env:
          DATABASE_URL: postgres://trovato:trovato@localhost:5432/trovato
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test-raw.log
          # CARGO_TERM_COLOR=always means cargo's output carries ANSI escapes, so
          # "Running tests/…" and "… ok" are not contiguous strings in the file.
          # Strip them once here rather than writing escape-tolerant patterns.
          sed -e 's/\x1b\[[0-9;]*m//g' test-raw.log > test.log

      # The schema test is the expensive one to lose silently: without a database
      # it does not skip, it fails — but a future `#[ignore]` or a renamed target
      # would drop it from the run with everything still green. Assert it ran.
      - name: The daemon-schema test actually ran
        run: |
          grep -q "Running tests/daemon_schema_test.rs" test.log \
            || { echo "::error::the daemon-schema test did not run"; exit 1; }
          grep -q "the_plugin_migration_is_a_faithful_copy_of_the_daemons_schema ... ok" test.log \
            || { echo "::error::the schema drift check did not pass"; exit 1; }

      # Same reasoning for the host-in-the-loop suite, which is the expensive one
      # to lose: it is the only thing anywhere that runs the compiled module
      # through a real kernel, and it arrived here from Trovato precisely so it
      # would not be dropped when netgrasp left that tree.
      - name: The host-in-the-loop test actually ran
        run: |
          grep -q "Running tests/sync_test.rs" test.log \
            || { echo "::error::the integration test did not run"; exit 1; }
          passed=$(grep -c '^test .* \.\.\. ok$' test.log)
          echo "$passed tests passed"
          grep -q "the_write_back_leaves_every_daemon_owned_column_untouched ... ok" test.log \
            || { echo "::error::the column-discipline test did not pass"; exit 1; }

      # The row menu's forms are the plugin's only write path that a person
      # reaches without the assistant, and the three things that matter about
      # them are the three that are easy to lose: both tiers change, a caller
      # without the permission changes nothing, and a POST with no token never
      # arrives. Each is named rather than counted, because a suite that still
      # runs while one of these quietly stops asserting is the case a count
      # cannot see.
      - name: The form suite proved both tiers, the permission and the token
        run: |
          for t in \
            a_posted_rename_changes_the_item_and_the_daemon_row_and_mints_what_is_missing \
            a_posted_owner_assignment_changes_the_owner_and_nothing_else \
            a_posted_flag_change_moves_one_column_and_leaves_the_other \
            a_form_post_from_a_caller_without_the_permission_changes_nothing \
            a_post_with_no_token_never_reaches_the_plugin \
            the_form_a_get_renders_carries_the_token_and_no_script \
            a_back_parameter_pointing_off_the_site_is_not_reflected
          do
            grep -q "$t ... ok" test.log \
              || { echo "::error::$t did not pass"; exit 1; }
          done

      # The listing templates are rendered rather than grepped by this one, and
      # it is the only thing anywhere that would notice a Tera error before a
      # reader did — a template that raises falls back to the kernel's dump of
      # every column, so the page still renders and nothing looks wrong.
      - name: The templates were rendered, not just searched
        run: |
          grep -q "every_listing_template_renders_with_the_rows_it_will_really_get ... ok" test.log \
            || { echo "::error::the template render test did not pass"; exit 1; }

  # Every migration is applied to a real Postgres, in order, exactly as the kernel
  # applies them. A migration that only ever runs on a developer's machine is a
  # migration that breaks on somebody else's install.
  migrations:
    name: migrations apply
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trovato
          POSTGRES_PASSWORD: trovato
          POSTGRES_DB: netgrasp_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trovato"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # 001 is the only migration that stands alone: the later four write into
      # kernel tables (gather_query, role_permissions, site_config, url_alias)
      # that only a Trovato install creates. So this job proves the daemon schema
      # migration is valid SQL against a real server, and the full ordered run is
      # what scripts/serve-demo.sh exercises against a Trovato database.
      - name: The schema migration applies, twice
        env:
          PGPASSWORD: trovato
        run: |
          psql -h localhost -U trovato -d netgrasp_migrations -v ON_ERROR_STOP=1 \
            -f plugins/netgrasp/migrations/001_netgrasp_schema.sql
          # It is guarded and forward-only, so a second run must be a no-op
          # rather than an error: the kernel reruns nothing, but an operator
          # replaying a migration should not be punished for it.
          psql -h localhost -U trovato -d netgrasp_migrations -v ON_ERROR_STOP=1 \
            -f plugins/netgrasp/migrations/001_netgrasp_schema.sql
          psql -h localhost -U trovato -d netgrasp_migrations -v ON_ERROR_STOP=1 \
            -c "select count(*) from ng_devices"

      # 007 is the other migration that stands alone: views over the ng_ tables
      # 001 creates, and nothing in a kernel table. `CREATE OR REPLACE VIEW` is
      # its guard, so the second run must also be a no-op, and the overview view
      # must answer with its one row on an empty database.
      - name: The overview views apply, twice, and the overview has one row
        env:
          PGPASSWORD: trovato
        run: |
          for _ in 1 2; do
            psql -h localhost -U trovato -d netgrasp_migrations -v ON_ERROR_STOP=1 \
              -f plugins/netgrasp/migrations/007_netgrasp_overview_views.sql
          done
          rows=$(psql -h localhost -U trovato -d netgrasp_migrations -v ON_ERROR_STOP=1 \
            -tAc "select count(*) from ng_overview")
          test "$rows" = "1"

  # The demo, brought up exactly as the README tells a reader to, and its front
  # page loaded. This is the only job that meets the PUBLISHED kernel image
  # rather than the pinned kernel crate the test suite links, and the only one
  # that goes through the kernel's own gather route and theme: a template that
  # raises there is not an error but a 200 carrying the kernel's column dump, so
  # scripts/verify-demo.sh checks for the overview's own markup, not a status.
  verify-demo:
    name: verify-demo (the front page loads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring the demo up
        run: docker compose -f docker-compose.demo.yml up -d --build

      # The installer is the last one-shot: it runs after the seed and exits 0
      # only once /overview answers 200. `wait` prints its exit code.
      - name: Wait for the first run to finish
        run: |
          code=$(docker compose -f docker-compose.demo.yml wait installer)
          echo "installer exited $code"
          test "$code" = "0"

      - name: verify-demo
        run: scripts/verify-demo.sh http://127.0.0.1:3101

      - name: The demo's logs
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color --tail 200

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      # The tests scan docker-compose.demo.yml as text, which catches a wrong
      # search path but not a mis-indented one. `config` is the parser itself,
      # and it also resolves the YAML anchors the file uses to keep the cron key
      # in one place.
      - name: The demo compose file parses
        run: docker compose -f docker-compose.demo.yml config >/dev/null
