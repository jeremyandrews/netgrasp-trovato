[workspace]
resolver = "2"
members = [
    "crates/netgrasp-core",
    "plugins/netgrasp",
]

[workspace.package]
# The plugin's own version, semantic from 1.0.0 on. It says nothing about the
# kernel: which Trovato this builds against is `kernel-release.toml` at the
# repository root, and CHANGELOG.md records the pin for every release.
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Jeremiah Andrews"]
repository = "https://github.com/jeremyandrews/netgrasp-trovato"

[workspace.dependencies]
# trovato-sdk — the Trovato plugin contract, consumed as an EXTERNAL git
# dependency. This repository builds with no Trovato checkout anywhere on disk,
# which is the whole point of it existing separately: netgrasp *builds on*
# Trovato and never modifies it. Do not reintroduce `path = "../../crates/
# plugin-sdk"`; that path dependency is what made this plugin unbuildable
# outside the monorepo it was split from.
#
# PINNED BY `rev`, deliberately, to a commit on the public Trovato repository.
# The rev is a literal here because cargo cannot read a git dependency's revision
# out of another file, but it is NOT authored here: `kernel-release.toml` holds
# the pinned release, `scripts/sync-kernel-release.sh` writes it onto this line,
# onto the trovato-kernel line below and into every other file that names it, and
# a test in plugins/netgrasp/src/lib.rs fails by name if any copy disagrees.
#
# `api_version` in plugins/netgrasp/netgrasp.info.toml must equal the kernel's
# KERNEL_API_VERSION or the kernel refuses to load the module; it is derived from
# the pinned version's major and minor, so it is written rather than chosen.
#
# BUMP PROTOCOL: `scripts/sync-kernel-release.sh --set-version X.Y.Z`. It
# resolves the tag to its commit and refuses a tag that does not resolve, so the
# rev cannot be transcribed wrongly. Then rerun `cargo build --target
# wasm32-wasip1 --release` and reinstall the plugin against a kernel built from
# the same rev. Never edit these revisions by hand.
#
# `trovato-sdk` pulls `trovato-sdk-macros` through a repo-relative path
# dependency; cargo resolves that inside the git checkout, so only this one
# entry is needed.
#
# Unlike the Ritrovo precedent, this points at the PUBLIC Trovato repository, so
# no private-repository access is needed to build this repo.
trovato-sdk = { git = "https://github.com/jeremyandrews/trovato.git", rev = "ca76a9603d3a9f4c94bb284e9e9dd9ae52cc3f74" }

netgrasp-core = { path = "crates/netgrasp-core" }

# trovato-kernel — TEST ONLY, and pinned to the same revision as the SDK above.
#
# The host-in-the-loop test (plugins/netgrasp/tests/sync_test.rs) drives the real
# module through the real TapDispatcher, ItemService and GatherService against a
# real Postgres. There is no way to do that without the kernel, and no reason to
# reimplement a fake one: a fake host is a fake answer to "does this plugin work".
#
# It is a DEV-dependency only, which is what keeps it harmless. Dev-dependencies
# are not built for `--target wasm32-wasip1`, so the shipped module is unaffected
# and the "builds standalone with no Trovato checkout" claim is untouched — the
# kernel arrives the same way the SDK does, as a pinned git revision.
#
# The rev must equal the SDK's. A plugin tested against one kernel revision and
# shipped against another is testing nothing; a test in src/lib.rs asserts the
# two pins are the same string.
trovato-kernel = { git = "https://github.com/jeremyandrews/trovato.git", rev = "ca76a9603d3a9f4c94bb284e9e9dd9ae52cc3f74" }

# Required only because `RequestServices::for_background` takes a `reqwest::Client`
# — the kernel's signature, not a choice this repo makes.
reqwest = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test-only, for crates/netgrasp-core's daemon-schema test. Dev-dependencies are
# not built for `--target wasm32-wasip1`, so the "every netgrasp-core dependency
# must be wasm-safe" rule is unaffected by anything listed here.
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

# Test-only, to RENDER the gather templates rather than grep them. The kernel
# renders them with plain Tera, so the same engine at the same major version is
# the real check: a syntax error or a filter that does not exist is otherwise
# invisible here and, at runtime, falls back to the kernel's dump of every
# column of the base table (DESIGN.md, `gather/netgrasp/page.html`).
tera = "1.20"

# Test-only, for the form suite. `axum` supplies the HeaderMap and
# `tower-sessions` the Session that the kernel's own CSRF gate takes, so the
# "a POST with no token is refused" test can call the real check with a real
# session rather than describe it. Both are the versions the pinned kernel uses.
axum = "0.8"
tower-sessions = "0.14"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Mirrors Trovato's own lint policy. A plugin traps on panic and the kernel can
# only report that it trapped, so `unwrap` and `expect` are denied rather than
# warned: an unwrap here is an error message nobody ever gets to read.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
manual_let_else = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
