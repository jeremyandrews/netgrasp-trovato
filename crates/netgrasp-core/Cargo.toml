[package]
name = "netgrasp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-agnostic sync, write-back and timeline core for the Netgrasp plugin"

[lints]
workspace = true

[lib]
# Plain rlib: this crate is host-agnostic pure logic. It is pulled into the
# `plugins/netgrasp` cdylib (compiled to wasm32-wasip1) AND compiled natively for
# its own unit tests, so every dependency must be wasm-safe (no net/fs/clock).
crate-type = ["lib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Test-only. Dev-dependencies are not built for `--target wasm32-wasip1`, so the
# "every dependency must be wasm-safe" rule above still holds: these exist for
# `tests/daemon_schema_test.rs`, which applies the daemon's own DDL to a scratch
# schema and runs the plugin's real statements against it. That test is the only
# thing on this side that ever meets the schema the plugin is written for.
[dev-dependencies]
chrono = { workspace = true }
dotenvy = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
