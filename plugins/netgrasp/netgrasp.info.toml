name = "netgrasp"
description = "Network monitoring: devices, people, events and presence from the netgrasp daemon"
# `api_version` must equal the kernel's `KERNEL_API_VERSION`, which is (0, 99) at
# the Trovato revision pinned in the workspace Cargo.toml. The kernel refuses to
# load a module that disagrees, so this string and that `rev` move together; a
# test in src/lib.rs asserts the pair has not drifted.
version = "0.99.0"
api_version = "0.99"
default_enabled = false
dependencies = []

[taps]
# tap_item_info declares the two Item types: ng_device (a device's user-owned
# overlay) and ng_person. The daemon-owned device state, the event log and the
# presence/location/IP timelines are record types, not Items — DESIGN.md
# Decisions 1 and 2.
#
# tap_cron is the daemon→kernel direction: it creates a device Item for each
# dirty ng_devices row, refreshes derived titles, prunes expired events, and
# clears sync_state.
#
# tap_item_update is the kernel→daemon direction: an admin's edit of a device
# Item writes the user-owned columns of ng_devices, and nothing else. It also
# mirrors an ng_person Item into ng_people for the daemon to read.
# tap_item_insert covers a person created rather than edited; tap_item_delete
# retires the mirror row and unlinks the device row.
#
# tap_item_view renders the device page: presence, location and address
# timelines over the daemon's tables. There is no other surface for it — a
# plugin cannot serve a request and cannot ship a template (G-NO-PLUGIN-HTTP).
#
# tap_item_presave coerces an admin's edit; it cannot refuse one
# (G-NO-PRESAVE-VETO).
#
# Note what is absent: tap_queue_worker and tap_queue_info. Netgrasp's work is a
# bounded sweep on a fixed cadence, not a per-item pipeline, so a queue would add
# a hop and a retry policy to something that is already idempotent and retried by
# the next cron tick.
implements = [
    "tap_item_info",
    "tap_item_view",
    "tap_item_presave",
    "tap_item_insert",
    "tap_item_update",
    "tap_item_delete",
    "tap_perm",
    "tap_menu",
    "tap_cron",
]
weight = 0

# Migrations are forward-only (no rollback). Each file runs once, tracked in the
# plugin_migration table. Kernel tables (item, gather_query, url_alias, roles,
# role_permissions, tile) are guaranteed to exist before plugin migrations run.
[migrations]
files = [
    "migrations/001_netgrasp_schema.sql",
    "migrations/002_netgrasp_gathers.sql",
    "migrations/003_netgrasp_roles_tiles.sql",
    "migrations/004_netgrasp_security_event_types.sql",
    "migrations/005_netgrasp_web_interface.sql",
    "migrations/006_netgrasp_owner_names.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared).
#   db        — execute_raw / query_raw against the ng_* tables (raw_sql).
#   item-api  — save-item / get-item for the device and person Items. The SDK
#               ships no binding for this interface; netgrasp declares the
#               externs itself in item_host.rs (G-SDK-NO-ITEM, inherited).
#   logging   — structured logging from the taps.
#   variables — the event retention window, read from site config.
#
# No http, no ai-api, no queue, no user-api: Netgrasp reaches nothing outside the
# database and does no AI work. The daemon does the network I/O.
[capabilities]
host_interfaces = [
    "db",
    "item-api",
    "logging",
    "variables",
]
raw_sql = true

# The daemon owns these tables at runtime; 001_netgrasp_schema.sql creates them
# idempotently so the plugin is installable without a daemon. They are named here
# as well so the effective allowlist does not depend on how the kernel parses
# CREATE statements. DESIGN.md Decision 8.
db_tables = [
    "ng_devices",
    "ng_people",
    "ng_events",
    "ng_presence",
    "ng_location_history",
    "ng_ip_history",
    "ng_state",
    # A view, not a table: ng_devices left-joined to the person who owns each row,
    # created by 006_netgrasp_owner_names.sql. It is here because the kernel
    # admits a record type only if its backing relation is in this allowlist
    # (RecordTypeRegistry::admit), and `ng_device_state` is declared over the
    # view so the device pages can print an owner's name instead of a uuid.
    #
    # The plugin itself never reads it. Every statement in netgrasp_core::queries
    # names ng_devices directly, which is what keeps the write path addressing the
    # real table.
    "ng_devices_with_owner",
]

# Lightweight record types (P11g / D-53).
#
# `ng_device_state` is deliberately not called `ng_device`: a record type name
# shares the gather `item_type` slot with content types and is rejected if it
# collides with one (RecordTypeRegistry::admit). A device is two tiers, so it
# needs two names.
#
# Every field below names a real column of the daemon's schema, and every field
# that renders a time names the generated `<column>_epoch` twin rather than the
# `timestamptz` it is derived from. The two paths that read these columns
# disagree about timestamps and neither produces the integer a record list wants:
# the structured `db` host decodes a fixed type list and falls through to a
# string decode, which a `timestamptz` fails, so it arrives as null; the gather
# path wraps the query in Postgres' `row_to_json`, so it arrives as an ISO 8601
# string. The epoch twin is the same integer on both.
#
# `id_column`, `created_column` and `changed_column` are declared on every record
# type below rather than defaulted. Their defaults are `id`, `created` and
# `changed`, and no daemon table has a `created` or a `changed`: the record
# admin's listing is `ORDER BY {changed_column}`
# (crates/kernel/src/routes/admin_record_type.rs), so a defaulted declaration is
# not a cosmetic wrong label but a 500 on every record list.
#
# `table` is the VIEW, not ng_devices. The view is ng_devices left-joined to
# ng_people, so a row arrives carrying `owner_name` and the device pages can name
# an owner instead of printing a uuid; a gather reads one record type and could
# not otherwise reach a second table (006_netgrasp_owner_names.sql argues the
# alternatives). Read-only either way — the record tier has no write surface, and
# the plugin's own statements name ng_devices directly.
[[record_types]]
name = "ng_device_state"
table = "ng_devices_with_owner"
id_column = "id"
title_column = "mac"
created_column = "first_seen_at_epoch"
changed_column = "last_seen_at_epoch"

[record_types.fields]
mac = "mac"
resolved_name = "resolved_name"
hostname = "hostname"
mdns_name = "mdns_name"
vendor = "vendor"
device_type = "device_type"
os_family = "os_family"
state = "state"
last_ip = "last_ip"
last_ipv6 = "last_ipv6"
current_ap = "current_ap"
current_location = "current_location"
first_seen = "first_seen_at_epoch"
last_seen = "last_seen_at_epoch"
display_name = "display_name"
owner_id = "owner_item_id"
# Exposed so a gather can sort and filter on it, which is what lets
# /who-is-home order its cards by name rather than by uuid.
owner_name = "owner_name"
hidden = "hidden"
notify = "notify"
item_id = "trovato_item_id"

# The event log. High-volume, never edited, deleted wholesale on a retention
# timer — the case the record tier exists for (DESIGN.md Decision 2).
[[record_types]]
name = "ng_event"
table = "ng_events"
id_column = "id"
title_column = "event_type"
created_column = "timestamp_epoch"
changed_column = "timestamp_epoch"

[record_types.fields]
device_id = "device_id"
event_type = "event_type"
timestamp = "timestamp_epoch"
details = "details"
notified = "notified"

# The device's history. Rendered onto the device page by tap_item_view; declared
# here so an operator can inspect the raw spans in the read-only record admin
# without a SQL client.
#
# `is_summary` is exposed on the two timelines that have it, because a record
# list that mixed compacted days with observed sessions without saying which is
# which would be actively misleading. The device page excludes summary rows
# outright.
[[record_types]]
name = "ng_presence"
table = "ng_presence"
id_column = "id"
title_column = "ip"
created_column = "started_at_epoch"
changed_column = "started_at_epoch"

[record_types.fields]
device_id = "device_id"
interface = "interface"
ip = "ip"
start_time = "started_at_epoch"
end_time = "ended_at_epoch"
is_summary = "is_summary"
observation_count = "observation_count"

[[record_types]]
name = "ng_location"
table = "ng_location_history"
id_column = "id"
title_column = "location"
created_column = "started_at_epoch"
changed_column = "started_at_epoch"

[record_types.fields]
device_id = "device_id"
ap_name = "ap_name"
location = "location"
start_time = "started_at_epoch"
end_time = "ended_at_epoch"
is_summary = "is_summary"

[[record_types]]
name = "ng_ip_history"
table = "ng_ip_history"
id_column = "id"
title_column = "ip"
created_column = "first_seen_epoch"
changed_column = "last_seen_epoch"

[record_types.fields]
device_id = "device_id"
ip = "ip"
interface = "interface"
first_seen = "first_seen_epoch"
last_seen = "last_seen_epoch"

# People are Items, and ng_people is their derived mirror for the daemon. It is
# declared read-only so an operator can confirm the mirror is in step with the
# Items without a SQL client.
#
# The primary key is item_id, not id. ng_people is the one daemon table with no
# timestamp the plugin can read — its last_arrived_at / last_departed_at are
# timestamptz with no epoch twin — so created and changed both name
# last_arrived_at. That is honest for `changed` (an arrival is the only thing
# that changes a mirror row daemon-side) and approximate for `created`, and the
# only consumer of either is the admin listing's ORDER BY.
#
# state, current_location and the two arrival timestamps are daemon-written and
# are not in the field map: a gather over them would render the timestamps as an
# ISO string through row_to_json, which is not what any other field here does.
[[record_types]]
name = "ng_person_mirror"
table = "ng_people"
id_column = "item_id"
title_column = "name"
created_column = "last_arrived_at"
changed_column = "last_arrived_at"

[record_types.fields]
item_id = "item_id"
name = "name"
notes = "notes"
notify_arrive = "notify_arrive"
notify_depart = "notify_depart"
state = "state"
current_location = "current_location"
