name = "netgrasp"
description = "Network monitoring: devices, people, events and presence from the netgrasp daemon"
# `version` is the plugin's own, and equals the workspace version.
#
# `api_version` must equal the kernel's `KERNEL_API_VERSION`, which is (0, 102) at
# the Trovato revision pinned in the workspace Cargo.toml. The kernel refuses to
# load a module that disagrees, so this string and that `rev` move together; a
# test in src/lib.rs asserts both against the workspace.
version = "1.2.0"
api_version = "0.102"
default_enabled = false
dependencies = []

[taps]
# tap_item_info declares the two Item types: ng_device (a device's user-owned
# overlay) and ng_person. The daemon-owned device state, the event log and the
# presence/location/IP timelines are record types, not Items — DESIGN.md
# Decisions 1 and 2.
#
# tap_cron is the daemon→kernel direction: it creates a device Item for each
# dirty ng_devices row, refreshes derived titles, prunes expired events, and
# clears sync_state.
#
# tap_item_update is the kernel→daemon direction: an admin's edit of a device
# Item writes the user-owned columns of ng_devices, and nothing else. It also
# mirrors an ng_person Item into ng_people for the daemon to read.
# tap_item_insert covers a person created rather than edited; tap_item_delete
# retires the mirror row and unlinks the device row.
#
# tap_item_view renders the device page: presence, location and address
# timelines over the daemon's tables. There is no other surface for it — a
# plugin cannot serve a request and cannot ship a template (G-NO-PLUGIN-HTTP).
#
# tap_item_presave coerces an admin's edit; it cannot refuse one
# (G-NO-PRESAVE-VETO).
#
# Note what is absent: tap_queue_worker and tap_queue_info. Netgrasp's work is a
# bounded sweep on a fixed cadence, not a per-item pipeline, so a queue would add
# a hop and a retry policy to something that is already idempotent and retried by
# the next cron tick.
implements = [
    "tap_item_info",
    "tap_item_view",
    "tap_item_presave",
    "tap_item_insert",
    "tap_item_update",
    "tap_item_delete",
    "tap_perm",
    "tap_menu",
    "tap_cron",
    # Configuring Netgrasp by conversation (kernel 0.102). The kernel dispatches
    # only the taps this list names, so an exported tap missing from here is
    # silently never called — which is exactly what a scope that never appears
    # looks like from the outside.
    "tap_assistant_scopes",
    "tap_assistant_context",
    "tap_assistant_tool",
    # The row menu's forms (kernel 0.99). tap_menu registers six paths with a
    # handler_type of "api" and a callback each; the kernel routes those to
    # tap_api, having already checked the entry's permission and, for a POST,
    # the _token. Without this line the paths are registered and every request
    # to one is dispatched to a plugin that does not answer.
    "tap_api",
    # Device data only for a viewer who holds `view netgrasp devices` (U1). A
    # gather has no permission of its own; this is what keeps an anonymous
    # visitor from reading every MAC on the network. 013 explains.
    "tap_field_access",
]
weight = 0

# Migrations are forward-only (no rollback). Each file runs once, tracked in the
# plugin_migration table. Kernel tables (item, gather_query, url_alias, roles,
# role_permissions, tile) are guaranteed to exist before plugin migrations run.
[migrations]
files = [
    "migrations/001_netgrasp_schema.sql",
    "migrations/002_netgrasp_gathers.sql",
    "migrations/003_netgrasp_roles_tiles.sql",
    "migrations/004_netgrasp_security_event_types.sql",
    "migrations/005_netgrasp_web_interface.sql",
    "migrations/006_netgrasp_owner_names.sql",
    "migrations/007_netgrasp_overview_views.sql",
    "migrations/008_netgrasp_overview.sql",
    "migrations/009_netgrasp_locations.sql",
    "migrations/010_netgrasp_new_devices.sql",
    "migrations/011_netgrasp_navigation.sql",
    "migrations/012_netgrasp_device_tabs_search.sql",
    "migrations/013_netgrasp_home.sql",
    "migrations/014_netgrasp_people.sql",
    "migrations/015_netgrasp_notify_schema.sql",
    "migrations/016_netgrasp_alerts.sql",
    "migrations/017_netgrasp_drop_duplicate_open_indexes.sql",
    "migrations/018_netgrasp_one_person_per_name.sql",
    "migrations/019_netgrasp_movements_by_person_index.sql",
    "migrations/020_netgrasp_event_views.sql",
    "migrations/021_netgrasp_event_gathers_read_the_views.sql",
    "migrations/022_netgrasp_presence_schema.sql",
    "migrations/023_netgrasp_presence_views.sql",
]

# Declared plugin capabilities (WASM-1, deny-unless-declared).
#   db        — execute_raw / query_raw against the ng_* tables (raw_sql).
#   item-api  — save-item / get-item for the device and person Items. The SDK
#               ships no binding for this interface; netgrasp declares the
#               externs itself in item_host.rs (G-SDK-NO-ITEM, inherited).
#   logging   — structured logging from the taps.
#   variables — the event retention window, read from site config.
#   user-api  — `current-user-has-permission`, checked by every assistant write
#               tool at the moment of the change. The kernel checks the scope's
#               permission when a conversation opens; a conversation outlives
#               that request, so the tool checks again.
#
# No http, no ai-api, no queue: Netgrasp reaches nothing outside the database and
# makes no AI calls of its own. The daemon does the network I/O, and the model
# calls are the kernel's — the assistant taps answer a model, they do not talk to
# one.
#
# `scripts/check-host-imports.sh` diffs this list against the module's real
# imports in BOTH directions, so this entry and the `current_user_has_permission`
# call it authorizes have to land in the same change.
[capabilities]
host_interfaces = [
    "db",
    "item-api",
    "logging",
    "user-api",
    "variables",
]
raw_sql = true

# The daemon owns these tables at runtime; 001_netgrasp_schema.sql creates them
# idempotently so the plugin is installable without a daemon. They are named here
# as well so the effective allowlist does not depend on how the kernel parses
# CREATE statements. DESIGN.md Decision 8.
db_tables = [
    "ng_devices",
    "ng_people",
    "ng_events",
    "ng_presence",
    "ng_location_history",
    "ng_ip_history",
    "ng_state",
    # A view, not a table: ng_devices left-joined to the person who owns each row,
    # created by 006_netgrasp_owner_names.sql. It is here because the kernel
    # admits a record type only if its backing relation is in this allowlist
    # (RecordTypeRegistry::admit), and `ng_device_state` is declared over the
    # view so the device pages can print an owner's name instead of a uuid.
    #
    # The plugin itself never reads it. Every statement in netgrasp_core::queries
    # names ng_devices directly, which is what keeps the write path addressing the
    # real table.
    "ng_devices_with_owner",
    # The overview's four views, created by 007_netgrasp_overview_views.sql and
    # declared as record types below for the same reason as the owner view. The
    # assistant's read tools select from them too, which is why they are named
    # here rather than only admitted: a structured `db` call against a relation
    # outside this list is refused with `table-not-declared`.
    "ng_people_presence",
    "ng_person_movements",
    "ng_devices_new",
    "ng_overview",
    # The two device record types' relations since 012: each is the view above
    # it plus one `search_text` column, which is what the Devices search box
    # filters on. Views over views rather than a column added in place, because
    # 006 and 007 must stay re-runnable (012 explains).
    "ng_devices_listed",
    "ng_devices_new_listed",
    # Home's row since 013: ng_overview plus the counts Home asks that the
    # overview did not (who is away, how many are unsorted, the three
    # actionable security events over the last day).
    "ng_home",
    # Who was merged into whom (014). The plugin's own table: the movements
    # view joins it so a merged person's past arrivals belong to the person
    # kept, without rewriting the daemon's events.
    "ng_person_merge",
    # The three relations the presence record types read since 023: each is the
    # view above it plus the presence columns (the person's switch, the
    # install's, the owner's state). New views rather than columns added in
    # place, because 006, 007, 012 and 013 must stay re-runnable (023 explains).
    "ng_people_presence_status",
    "ng_home_presence",
    "ng_devices_listed_presence",
    # netgraspd's notify tables (its schema V4; 015 is the guarded copy). The
    # Alerts page reads whether delivery is configured from ng_notify_status,
    # and Send test inserts one row into ng_notify_requests for the daemon to
    # answer. Neither holds the topic or the token.
    "ng_notify_status",
    "ng_notify_requests",
    # The event pages' three views (020): the newest 10,000 events, each
    # device's newest 10,000, and the security events. Declared for the same
    # reason as the overview's views: each backs a record type below.
    "ng_events_recent",
    "ng_device_events",
    "ng_security_events",
]

# Lightweight record types (P11g / D-53).
#
# `ng_device_state` is deliberately not called `ng_device`: a record type name
# shares the gather `item_type` slot with content types and is rejected if it
# collides with one (RecordTypeRegistry::admit). A device is two tiers, so it
# needs two names.
#
# Every field below names a real column of the daemon's schema, and every field
# that renders a time names the generated `<column>_epoch` twin rather than the
# `timestamptz` it is derived from. The two paths that read these columns
# disagree about timestamps and neither produces the integer a record list wants:
# the structured `db` host decodes a fixed type list and falls through to a
# string decode, which a `timestamptz` fails, so it arrives as null; the gather
# path wraps the query in Postgres' `row_to_json`, so it arrives as an ISO 8601
# string. The epoch twin is the same integer on both. (Three event record types
# map a `timestamp` field to `"timestamp"` itself, to sort on it; it is never
# what a page prints. They say why where they are declared.)
#
# `id_column`, `created_column` and `changed_column` are declared on every record
# type below rather than defaulted. Their defaults are `id`, `created` and
# `changed`, and no daemon table has a `created` or a `changed`: the record
# admin's listing is `ORDER BY {changed_column}`
# (crates/kernel/src/routes/admin_record_type.rs), so a defaulted declaration is
# not a cosmetic wrong label but a 500 on every record list.
#
# `table` is the VIEW, not ng_devices. The view is ng_devices left-joined to
# ng_people, so a row arrives carrying `owner_name` and the device pages can name
# an owner instead of printing a uuid; a gather reads one record type and could
# not otherwise reach a second table (006_netgrasp_owner_names.sql argues the
# alternatives). Read-only either way — the record tier has no write surface, and
# the plugin's own statements name ng_devices directly.
#
# Since 012 it is `ng_devices_listed`: that same owner view, ng_devices_with_owner,
# plus the lower-cased `search_text` the Devices search box filters on. Since 023
# it is `ng_devices_listed_presence`, that plus the owner's `owner_state`, which
# Who is home filters on.
[[record_types]]
name = "ng_device_state"
table = "ng_devices_listed_presence"
id_column = "id"
title_column = "mac"
created_column = "first_seen_at_epoch"
changed_column = "last_seen_at_epoch"

[record_types.fields]
mac = "mac"
resolved_name = "resolved_name"
hostname = "hostname"
mdns_name = "mdns_name"
vendor = "vendor"
device_type = "device_type"
os_family = "os_family"
state = "state"
last_ip = "last_ip"
last_ipv6 = "last_ipv6"
current_ap = "current_ap"
current_location = "current_location"
first_seen = "first_seen_at_epoch"
last_seen = "last_seen_at_epoch"
display_name = "display_name"
owner_id = "owner_item_id"
# Exposed so a gather can sort and filter on it, which is what lets
# /who-is-home order its cards by name rather than by uuid.
owner_name = "owner_name"
# The owner's ng_people.state (023), so the device-shaped Who is home lists only
# the people the daemon counts as home.
owner_state = "owner_state"
hidden = "hidden"
notify = "notify"
item_id = "trovato_item_id"
# Every name, the MAC, the vendor, the address and the owner, lower-cased into
# one string (012). Not shown anywhere: it is what the Devices search box's
# exposed `contains` filter compares against.
search = "search_text"

# The event log. High-volume, never edited, deleted wholesale on a retention
# timer — the case the record tier exists for (DESIGN.md Decision 2).
#
# `created_column` and `changed_column` name `"timestamp"`, the column the
# daemon indexes (ng_events_time_idx): the record admin's listing is `ORDER BY
# {changed_column} DESC LIMIT n`, which over the unindexed `timestamp_epoch`
# sorted the whole table to show its first rows. The listing prints only the id
# and the title, so the `timestamptz` is never decoded.
#
# The `timestamp` field still maps to `timestamp_epoch` here, because this
# record type now backs only /activity and /events/new-devices, whose filters
# name `new_device` and no daemon index serves. A sort on `"timestamp"` makes
# the planner walk the time index looking for rare rows, which is slower than
# the scan it replaces (021 says more). The three event pages an index can
# answer read the record types below.
[[record_types]]
name = "ng_event"
table = "ng_events"
id_column = "id"
title_column = "event_type"
created_column = "timestamp"
changed_column = "timestamp"

[record_types.fields]
device_id = "device_id"
event_type = "event_type"
timestamp = "timestamp_epoch"
details = "details"
notified = "notified"

# The event pages that read a daemon index (020, 021). Each is an `ng_event`
# over a view, with one difference that is the point: the `timestamp` field
# maps to `"timestamp"`, so a gather's sort on it is `ORDER BY "timestamp"` and
# the daemon's time index (or its device index, a device's events by time)
# serves it. Nothing filters on that field: a filter would compare a
# `timestamptz`, which a number or a date string from a gather cannot match.
# The rows still carry `timestamp_epoch`, which is what every template prints.
#
# /events: the newest 10,000 events.
[[record_types]]
name = "ng_event_recent"
table = "ng_events_recent"
id_column = "id"
title_column = "event_type"
created_column = "timestamp"
changed_column = "timestamp"

[record_types.fields]
device_id = "device_id"
event_type = "event_type"
timestamp = "timestamp"
details = "details"
notified = "notified"

# /events/device: one device's newest 10,000 events.
[[record_types]]
name = "ng_device_event"
table = "ng_device_events"
id_column = "id"
title_column = "event_type"
created_column = "timestamp"
changed_column = "timestamp"

[record_types.fields]
device_id = "device_id"
event_type = "event_type"
timestamp = "timestamp"
details = "details"
notified = "notified"

# /events/security: every security event. The overview counts the same view.
[[record_types]]
name = "ng_security_event"
table = "ng_security_events"
id_column = "id"
title_column = "event_type"
created_column = "timestamp"
changed_column = "timestamp"

[record_types.fields]
device_id = "device_id"
event_type = "event_type"
timestamp = "timestamp"
details = "details"
notified = "notified"

# The device's history. Rendered onto the device page by tap_item_view; declared
# here so an operator can inspect the raw spans in the read-only record admin
# without a SQL client.
#
# `is_summary` is exposed on the two timelines that have it, because a record
# list that mixed compacted days with observed sessions without saying which is
# which would be actively misleading. The device page excludes summary rows
# outright.
[[record_types]]
name = "ng_presence"
table = "ng_presence"
id_column = "id"
title_column = "ip"
created_column = "started_at_epoch"
changed_column = "started_at_epoch"

[record_types.fields]
device_id = "device_id"
interface = "interface"
ip = "ip"
start_time = "started_at_epoch"
end_time = "ended_at_epoch"
is_summary = "is_summary"
observation_count = "observation_count"

[[record_types]]
name = "ng_location"
table = "ng_location_history"
id_column = "id"
title_column = "location"
created_column = "started_at_epoch"
changed_column = "started_at_epoch"

[record_types.fields]
device_id = "device_id"
ap_name = "ap_name"
location = "location"
start_time = "started_at_epoch"
end_time = "ended_at_epoch"
is_summary = "is_summary"

[[record_types]]
name = "ng_ip_history"
table = "ng_ip_history"
id_column = "id"
title_column = "ip"
created_column = "first_seen_epoch"
changed_column = "last_seen_epoch"

[record_types.fields]
device_id = "device_id"
ip = "ip"
interface = "interface"
first_seen = "first_seen_epoch"
last_seen = "last_seen_epoch"

# People are Items, and ng_people is their derived mirror for the daemon. It is
# declared read-only so an operator can confirm the mirror is in step with the
# Items without a SQL client.
#
# The primary key is item_id, not id. ng_people is the one daemon table with no
# timestamp the plugin can read — its last_arrived_at / last_departed_at are
# timestamptz with no epoch twin — so created and changed both name
# last_arrived_at. That is honest for `changed` (an arrival is the only thing
# that changes a mirror row daemon-side) and approximate for `created`, and the
# only consumer of either is the admin listing's ORDER BY.
#
# state, current_location and the two arrival timestamps are daemon-written and
# are not in the field map: a gather over them would render the timestamps as an
# ISO string through row_to_json, which is not what any other field here does.
[[record_types]]
name = "ng_person_mirror"
table = "ng_people"
id_column = "item_id"
title_column = "name"
created_column = "last_arrived_at"
changed_column = "last_arrived_at"

[record_types.fields]
item_id = "item_id"
name = "name"
notes = "notes"
notify_arrive = "notify_arrive"
notify_depart = "notify_depart"
state = "state"
current_location = "current_location"

# ---------------------------------------------------------------------------
# The overview's four views (007_netgrasp_overview_views.sql)
# ---------------------------------------------------------------------------
# Read-only like every record type here, and each over a VIEW, for the reasons
# 007 gives: three of the questions are relative to the clock and the fourth is a
# count, and a gather filter can express neither.
#
# Where a field is what an include joins on, its logical name IS its physical
# column name: `state`, `day`, `period`. The kernel uses an include's
# `child_field` twice, once as a filter field (rewritten through this map) and
# once to read the child row (which is keyed by physical column), so a join field
# whose two names differed would filter correctly and then attach nothing.

# One person, with the arrival times as epoch twins ng_people itself lacks.
[[record_types]]
name = "ng_person_presence"
table = "ng_people_presence_status"
id_column = "item_id"
title_column = "name"
created_column = "last_arrived_at_epoch"
changed_column = "last_arrived_at_epoch"

[record_types.fields]
item_id = "item_id"
name = "name"
state = "state"
current_location = "current_location"
last_arrived = "last_arrived_at_epoch"
last_departed = "last_departed_at_epoch"
devices_online = "devices_online"
# 023: the person's own switch, the install's, and home/away/untracked as 0/1/2
# so /people/home can list everybody in that order.
track_presence = "track_presence"
presence_tracking = "presence_tracking"
state_rank = "state_rank"

# One arrival or departure, with its `details` lifted into columns.
[[record_types]]
name = "ng_person_movement"
table = "ng_person_movements"
id_column = "id"
title_column = "event_type"
created_column = "timestamp_epoch"
changed_column = "timestamp_epoch"

[record_types.fields]
event_type = "event_type"
timestamp = "timestamp_epoch"
day = "day"
person_item_id = "person_item_id"
person_name = "person_name"
location = "location"
via = "via"
device_id = "device_id"

# A device first seen in the last seven days.
[[record_types]]
name = "ng_device_new"
table = "ng_devices_new_listed"
id_column = "id"
title_column = "mac"
created_column = "first_seen_at_epoch"
changed_column = "last_seen_at_epoch"

[record_types.fields]
mac = "mac"
display_name = "display_name"
resolved_name = "resolved_name"
hostname = "hostname"
vendor = "vendor"
device_type = "device_type"
device_type_confidence = "device_type_confidence"
os_family = "os_family"
state = "state"
hidden = "hidden"
owner_id = "owner_item_id"
owner_name = "owner_name"
item_id = "trovato_item_id"
first_seen = "first_seen_at_epoch"
last_seen = "last_seen_at_epoch"
period = "period"
search = "search_text"

# The overview's single row. Its columns are counts, which is the only way a
# gather page gets a number that is not a pager total.
# Declared over `ng_home` since 013: the same row plus Home's own counts; over
# `ng_home_presence` since 023, which adds the untracked people and the switch.
[[record_types]]
name = "ng_overview"
table = "ng_home_presence"
id_column = "id"
title_column = "today"
created_column = "generated_at_epoch"
changed_column = "generated_at_epoch"

[record_types.fields]
today = "today"
home_state = "home_state"
new_period = "new_period"
people_home = "people_home"
people_total = "people_total"
devices_online = "devices_online"
devices_new = "devices_new"
movements_today = "movements_today"
security_events = "security_events"
security_events_24h = "security_events_24h"
generated_at = "generated_at_epoch"
away_state = "away_state"
devices_unsorted = "devices_unsorted"
arp_spoof_24h = "arp_spoof_24h"
ip_conflict_24h = "ip_conflict_24h"
rogue_dhcp_24h = "rogue_dhcp_24h"
# 023: the people nobody is tracking, and whether the install tracks anybody.
untracked_state = "untracked_state"
presence_tracking = "presence_tracking"
people_away = "people_away"
people_untracked = "people_untracked"
