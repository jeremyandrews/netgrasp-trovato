[package]
name = "netgrasp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Network monitoring plugin for Trovato"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK is an EXTERNAL git dependency pinned in the workspace manifest — see
# the bump protocol there. It is deliberately not a path into a Trovato
# checkout: this repo builds with no Trovato source on disk.
trovato-sdk = { workspace = true }
netgrasp-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The host-in-the-loop test only. None of this is built for wasm32-wasip1 —
# dev-dependencies never are — so the shipped module carries none of it.
[dev-dependencies]
trovato-kernel = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
dotenvy = { workspace = true }
